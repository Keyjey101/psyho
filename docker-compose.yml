version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - ZAI_API_KEY=${ZAI_API_KEY}
      - ZAI_BASE_URL=${ZAI_BASE_URL:-https://api.zai.chat/v1}
      - ZAI_MODEL=${ZAI_MODEL:-glm-5}
      - ZAI_SMALL_MODEL=${ZAI_SMALL_MODEL:-glm-4-flash}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - ENVIRONMENT=production
      - SESSION_MAX_EXCHANGES=${SESSION_MAX_EXCHANGES}
      - ADMIN_TELEGRAM_USERNAMES=${ADMIN_TELEGRAM_USERNAMES:-}
      - DATABASE_URL=sqlite+aiosqlite:////data/psyho.db
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - TEST_PASSWORD_CODE=${TEST_PASSWORD_CODE:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      # ── Monetization ──────────────────────────────────────────────
      - MONETIZATION_ENABLED=${MONETIZATION_ENABLED:-false}
      - PRICING_PRO_MONTH_KOPECKS=${PRICING_PRO_MONTH_KOPECKS:-39000}
      - PRICING_PRO_3M_KOPECKS=${PRICING_PRO_3M_KOPECKS:-99000}
      - PRICING_PRO_YEAR_KOPECKS=${PRICING_PRO_YEAR_KOPECKS:-299000}
      - PRICING_PACK_5_KOPECKS=${PRICING_PACK_5_KOPECKS:-29000}
      - PRICING_PACK_15_KOPECKS=${PRICING_PACK_15_KOPECKS:-69000}
      - FREE_LIFETIME_SESSIONS=${FREE_LIFETIME_SESSIONS:-2}
      - FREE_DAILY_ACTIONS=${FREE_DAILY_ACTIONS:-1}
      - PACK_5_SIZE=${PACK_5_SIZE:-5}
      - PACK_15_SIZE=${PACK_15_SIZE:-15}
      - WS_RATE_LIMIT_FREE=${WS_RATE_LIMIT_FREE:-20}
      - WS_RATE_LIMIT_PRO=${WS_RATE_LIMIT_PRO:-60}
      - WS_RATE_LIMIT_PACKAGE=${WS_RATE_LIMIT_PACKAGE:-30}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:-}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:-}
      - YOOKASSA_RETURN_URL=${YOOKASSA_RETURN_URL:-}
      - SUBSCRIPTION_GRACE_DAYS=${SUBSCRIPTION_GRACE_DAYS:-3}
      - SUBSCRIPTION_RENEW_LOOKAHEAD_HOURS=${SUBSCRIPTION_RENEW_LOOKAHEAD_HOURS:-24}
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_TG_BOT_USERNAME=${VITE_TG_BOT_USERNAME:-}
        - SESSION_MAX_EXCHANGES=${SESSION_MAX_EXCHANGES}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:

volumes:
  sqlite_data:
